[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextpilot"
version = "0.1.0"
description = "Python middleware that compresses and optimizes LLM context before each API call"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "httpx>=0.25",
    "click>=8.0",
]

[project.scripts]
contextpilot = "contextpilot.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
proxy = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "starlette>=0.27"]
all = ["openai>=1.0", "anthropic>=0.20", "fastapi>=0.100", "uvicorn[standard]>=0.23", "starlette>=0.27"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "openai>=1.0",
    "anthropic>=0.20",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "starlette>=0.27",
    "httpx>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["contextpilot"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]

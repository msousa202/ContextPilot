[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextpilot-ai"
version = "0.2.1"
description = "Python middleware that compresses and optimizes LLM context before each API call"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mario Sousa", email = "contact@contextpilot.org" }]
keywords = ["llm", "context", "compression", "openai", "anthropic", "token", "cost", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "httpx>=0.25",
    "click>=8.0",
]

[project.urls]
Homepage = "https://contextpilot.org"
Repository = "https://github.com/msousa202/ContextPilot"
Documentation = "https://contextpilot.org/docs"
"Bug Tracker" = "https://github.com/msousa202/ContextPilot/issues"

[project.scripts]
contextpilot = "contextpilot.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
proxy = ["starlette>=0.27", "uvicorn[standard]>=0.23"]
mcp = ["mcp>=1.0"]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "starlette>=0.27",
    "uvicorn[standard]>=0.23",
    "mcp>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "openai>=1.0",
    "anthropic>=0.20",
    "starlette>=0.27",
    "uvicorn[standard]>=0.23",
    "httpx>=0.25",
    "mcp>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["contextpilot"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]

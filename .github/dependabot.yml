version: 2

updates:
  # Python dependencies, weekly on Mondays
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    reviewers:
      - msousa202
    ignore:
      # mcp 2.x is a breaking rewrite: it removes mcp.server.fastmcp and swaps
      # httpx for httpx2. contextpilot/mcp_server.py targets the 1.x FastMCP
      # API, so a major bump breaks Surface C. Revisit only alongside a
      # deliberate port of the MCP server. See PR #48.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "hypothesis"
          - "codecov*"
      core-deps:
        patterns:
          - "pydantic"
          - "pyyaml"
          - "numpy"
          - "scikit-learn"
          - "httpx"
          - "click"
      llm-sdks:
        patterns:
          - "openai"
          - "anthropic"
          - "mcp"
      proxy-stack:
        patterns:
          - "starlette"
          - "uvicorn"

  # GitHub Actions, monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "08:00"
      timezone: "Europe/Lisbon"
    labels:
      - dependencies
      - ci
    reviewers:
      - msousa202
